# mise — per-repo tool versions (RickCogley/dotfiles#81) and pinned global
# tools (#83)
#
# Node per repo. Repos pin Node in .node-version or .nvmrc, the files
# Cloudflare builds and CI follow; mise makes local runs follow them too.
# Outside a pinned repo, `node` stays Homebrew's (not_found_system_fallback,
# on by default).
#
# fnox globally, from jdx's GitHub releases (#83). Those builds are signed
# with his Developer ID, so a Keychain "Always Allow" survives upgrades;
# Homebrew's build is ad-hoc signed, and every upgrade would ask for the login
# password once per stored secret. Pinned exactly: `up` reports a newer
# release, and the pin is bumped here on purpose.
#
# Secrets never go in an [env] section here or in a repo's mise.toml: they
# reach commands through `keys run`, one process at a time.

[settings]
idiomatic_version_file_enable_tools = ["node"]

[tools]
fnox = "1.45.0"
